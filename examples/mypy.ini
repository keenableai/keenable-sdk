# Type checks the Python examples, and the live smoke test, against the SDK in
# python/. Run from python/:
#   uv run --group dev mypy --config-file ../examples/mypy.ini ../examples ../scripts/smoke
# Third-party model SDKs are not installed for the check: their calls are
# untyped, and every Keenable call is still checked in full.
[mypy]
strict = True

[mypy-cerebras.*]
ignore_missing_imports = True
