name: Test

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

# A follow-up push supersedes the run in flight; without this its jobs keep
# burning runner minutes on a commit nobody is waiting for any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The shared fixtures every SDK tests against. A case or catalog change
  # without the regenerated copies fails here, before any SDK runs a stale copy.
  fixtures:
    name: Shared fixtures are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The sync scripts are TypeScript run directly, which needs Node 22.18+.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Error contract
        run: node scripts/error-contract/sync.ts --check
      - name: Conformance cases
        run: node scripts/conformance/sync.ts --check

  # Version-independent checks, so they run once rather than once per matrix leg.
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      # The dev group in pyproject.toml is the single source of tool versions.
      - name: Ruff
        run: uv run --group dev ruff check . && uv run --group dev ruff format --check .
      - name: Mypy
        run: uv run --group dev mypy keenable
      # Report only: no threshold, so coverage can never fail the build.
      - name: Coverage report
        run: uv run --group dev pytest -q --cov=keenable --cov-branch --cov-report=term-missing
      # Without py.typed in the wheel, type checkers treat the installed
      # package as untyped and every annotation above is invisible to users.
      - name: Wheel ships py.typed
        run: |
          uv build --wheel --out-dir dist
          unzip -l dist/*.whl | grep -q 'keenable/py.typed' \
            || { echo "::error::the wheel is missing keenable/py.typed"; exit 1; }

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Test
        run: uv run --python ${{ matrix.python-version }} --group dev pytest -q

  typescript:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # npm 10's arborist crashes ("Cannot read properties of null (reading
      # 'edgesOut')") resolving vitest 4's optional peer set; legacy peer
      # resolution skips that path. Our own deps carry no peers we rely on.
      - run: npm install --legacy-peer-deps
      - run: npm test
      # tsc and tsup read the pinned compiler from devDependencies, so their
      # answer cannot vary by Node version; run them once.
      - name: Type check and build
        if: matrix.node-version == '22'
        run: npm run typecheck && npm run build
      # Report only: no threshold, so coverage can never fail the build.
      - name: Coverage report
        if: matrix.node-version == '22'
        run: npm run coverage

  go:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.22", "oldstable", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Test
        run: go test -cover ./...
      - name: Vet
        run: go vet ./...
      - name: Example builds
        run: go build -o /dev/null ./example/hello
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "$out"
            exit 1
          fi
