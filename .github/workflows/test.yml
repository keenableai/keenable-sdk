name: Test

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Lint
        run: uvx ruff@0.9.6 check . && uvx ruff@0.9.6 format --check .
      - name: Type check
        run: uv run --python ${{ matrix.python-version }} --with mypy --with httpx --with pytest mypy keenable
      - name: Test
        run: uv run --python ${{ matrix.python-version }} --with pytest --with pytest-asyncio --with httpx pytest -q

  typescript:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
