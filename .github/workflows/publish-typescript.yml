name: Publish TypeScript to npm

# Builds the `keenable` TypeScript SDK once, then ships the same tarball two ways:
#   - GitHub Release assets: the `keenable-<version>.tgz` is attached to the
#     `ts-v<version>` release, so it can be installed straight from GitHub
#     (npm install https://github.com/keenableai/keenable-sdk/releases/download/ts-v<version>/keenable-<version>.tgz)
#     with no npm account involved;
#   - npm, via Trusted Publishing (OIDC): no npm token or OTP stored anywhere,
#     and the package gets a provenance attestation.
# The two ship jobs are independent: npm failing (for example before the
# Trusted Publisher is registered) does not stop the GitHub assets, and
# re-running the failed job finishes npm later.
#
# Runs when a GitHub Release whose tag starts with `ts-v` is published, or when
# cut-sdk-release.yml dispatches it on the `ts-v<version>` tag. The tag must
# match the version in typescript/package.json.
#
# One-time setup on npmjs.com: package `keenable` -> Settings -> Trusted
# Publisher -> GitHub Actions, repo `keenableai/keenable-sdk`, workflow
# `publish-typescript.yml`, environment `npm`, and under Allowed actions tick
# `npm publish`. New configurations default to `npm stage publish` only, which
# this workflow's direct `npm publish` cannot use.
#
# A manual dispatch must be on a `ts-v*` tag whose commit is on main, so a
# branch named like a release cannot reach the OIDC publish. Adding a required
# reviewer to the `npm` environment (Settings -> Environments) puts a human
# approval in front of every npm publish.

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  build:
    name: Build package
    # Release-triggered runs are gated on the tag so a Python release does not
    # try to publish the npm package.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && startsWith(github.ref_name, 'ts-v')) ||
      startsWith(github.event.release.tag_name, 'ts-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0 # history to check the tag is on main

      - name: Release commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse --short HEAD) is not on main; only merged release commits are published"
            exit 1
          fi

      - name: Tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          ver=$(jq -r .version package.json)
          if [ "$TAG" != "ts-v$ver" ]; then
            echo "::error::tag $TAG does not match package.json version $ver (expected ts-v$ver)"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: npm install --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: typescript/keenable-*.tgz
          if-no-files-found: error

  github-assets:
    name: Attach to the GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # upload release assets
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: pkg/

      - name: Upload the tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          # Fail, don't skip: a run that "succeeds" without the asset would be
          # taken for done, and a re-run once the release exists attaches it.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::no GitHub Release for $TAG to attach the tarball to; create it, then re-run this job"
            exit 1
          fi
          gh release upload "$TAG" pkg/keenable-*.tgz --repo "$GITHUB_REPOSITORY" --clobber

  npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/keenable
    permissions:
      contents: read
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: pkg/

      # Trusted Publishing needs npm >= 11.5.1, which ships with Node 24.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      # Publishes the tarball the build produced, so npm gets the same bytes
      # as the GitHub Release. The leading ./ matters: without it npm reads
      # `pkg/keenable-x.tgz` as a GitHub `user/repo` shorthand and tries to
      # `git ls-remote` it over ssh.
      - name: Publish
        run: npm publish ./pkg/keenable-*.tgz --access public
