name: Publish TypeScript to npm

# Publishes the `keenable` TypeScript SDK to npm via Trusted Publishing (OIDC):
# no npm token or OTP stored anywhere, and the package gets a provenance
# attestation. Runs when a GitHub Release whose tag starts with `ts-v` is
# published, or when cut-sdk-release.yml dispatches it on the `ts-v<version>`
# tag. The tag must match the version in typescript/package.json.
#
# One-time setup on npmjs.com: package `keenable` -> Settings -> Trusted
# Publisher -> GitHub Actions, repo `keenableai/keenable-sdk`, workflow
# `publish-typescript.yml`, environment `npm`, and under Allowed actions tick
# `npm publish`. New configurations default to `npm stage publish` only, which
# this workflow's direct `npm publish` cannot use.
#
# A manual dispatch must be on a `ts-v*` tag whose commit is on main, so a
# branch named like a release cannot reach the OIDC publish. Adding a required
# reviewer to the `npm` environment (Settings -> Environments) puts a human
# approval in front of every publish.

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  publish:
    name: Publish to npm
    # Release-triggered runs are gated on the tag so a Python release does not
    # try to publish the npm package.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && startsWith(github.ref_name, 'ts-v')) ||
      startsWith(github.event.release.tag_name, 'ts-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/keenable
    permissions:
      contents: read
      id-token: write # required for Trusted Publishing (OIDC)
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0 # history to check the tag is on main

      - name: Release commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse --short HEAD) is not on main; only merged release commits are published"
            exit 1
          fi

      - name: Tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          ver=$(jq -r .version package.json)
          if [ "$TAG" != "ts-v$ver" ]; then
            echo "::error::tag $TAG does not match package.json version $ver (expected ts-v$ver)"
            exit 1
          fi

      # Trusted Publishing needs npm >= 11.5.1, which ships with Node 24.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - run: npm install --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run

      - name: Publish
        run: npm publish --access public
